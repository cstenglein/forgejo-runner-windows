name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set build version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME -replace '^v', ''
          } else {
            '13.2.0-dev.' + $env:GITHUB_SHA.Substring(0, 8)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          "BUILD_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the checked-out source
        run: ./contrib/windows/Build.ps1 -Version $env:BUILD_VERSION
      - name: Run Windows checks
        run: ./contrib/windows/Test.ps1
      - name: Package binary, matching source and checksums
        run: ./contrib/windows/Package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-amd64
          path: dist/release/${{ env.BUILD_VERSION }}/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-amd64
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content release/build-manifest.json -Raw | ConvertFrom-Json
          $notes = @"
          Community Windows x64 build of Forgejo Runner $($manifest.Version).

          Built from this repository at commit $($manifest.SourceRevision).
          Local source fixes are included. Uses native Windows DNS for VPN/NRPT compatibility.
          Includes the matching source archive, GPL license and SHA-256 checksums.
          The executable is not code-signed. Upstream does not officially support Windows.
          "@
          $notes | Set-Content release-notes.txt -Encoding utf8
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Forgejo Runner $($manifest.Version) for Windows x64" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
